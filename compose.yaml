services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    # Small memory footprint for local development.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    ports:
      - "5432:5432"
    volumes:
      # Init scripts run in name order, only on an empty database.
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: ./src
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
