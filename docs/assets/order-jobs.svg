<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 630" width="640" height="630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .entry { fill: #f6f8fa; stroke: #59636e; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .job { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .periodic { stroke-dasharray: 5 4; }
    .end { fill: #f6f8fa; stroke-width: 1.5; }
    .ok { stroke: #1a7f37; }
    .bad { stroke: #cf222e; }
    .name { fill: #1f2328; font-size: 13px; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle; dominant-baseline: central; }
    .status { fill: #1f2328; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .edge { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .arrow { marker-end: url(#arrow); }
    .why { fill: #59636e; font-size: 12px; }
    .every { fill: #59636e; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
    .tip { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .entry, .end { fill: #161b22; stroke: #9198a1; }
      .job { fill: #0c2d6b; stroke: #4493f8; }
      .ok { stroke: #3fb950; }
      .bad { stroke: #f85149; }
      .name, .status { fill: #e6edf3; }
      .edge { stroke: #9198a1; }
      .why, .tip, .every { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- entry -->
  <rect class="entry" x="60" y="20" width="220" height="44" rx="8"/>
  <text class="name" x="170" y="42">POST /orders</text>

  <!-- jobs -->
  <rect class="job" x="60" y="130" width="220" height="44" rx="8"/>
  <text class="name" x="170" y="152">GeocodeAddress</text>
  <rect class="job" x="60" y="240" width="220" height="44" rx="8"/>
  <text class="name" x="170" y="262">AllocateStock</text>
  <rect class="job" x="60" y="350" width="220" height="44" rx="8"/>
  <text class="name" x="170" y="372">ChargePayment</text>
  <rect class="job" x="380" y="350" width="180" height="44" rx="8"/>
  <text class="name" x="470" y="372">ReleaseStock</text>

  <!-- final statuses -->
  <rect class="end ok" x="105" y="460" width="130" height="36" rx="18"/>
  <text class="status" x="170" y="478">CONFIRMED</text>
  <rect class="end bad" x="405" y="460" width="130" height="36" rx="18"/>
  <text class="status" x="470" y="478">FAILED</text>

  <!-- POST /orders → GeocodeAddress -->
  <path class="edge arrow" d="M170,64 V128"/>

  <!-- GeocodeAddress → AllocateStock / FAILED -->
  <path class="edge arrow" d="M170,174 V238"/>
  <text class="why" x="182" y="210">address found</text>
  <path class="edge arrow" d="M280,152 H600 V478 H537"/>
  <text class="why" x="440" y="144" text-anchor="middle">address not found</text>

  <!-- AllocateStock → ChargePayment / FAILED (joins the line above) -->
  <path class="edge arrow" d="M170,284 V348"/>
  <text class="why" x="182" y="320">stock reserved</text>
  <path class="edge" d="M280,262 H600"/>
  <text class="why" x="440" y="254" text-anchor="middle">no warehouse</text>

  <!-- ChargePayment → CONFIRMED / ReleaseStock -->
  <path class="edge arrow" d="M170,394 V458"/>
  <text class="why" x="182" y="430">approved</text>
  <path class="edge arrow" d="M280,372 H378"/>
  <text class="why" x="329" y="364" text-anchor="middle">declined</text>

  <!-- ReleaseStock → FAILED -->
  <path class="edge arrow" d="M470,394 V458"/>
  <text class="why" x="482" y="430">stock returned</text>

  <!-- periodic sweeper for jobs River discarded after their last attempt -->
  <rect class="job periodic" x="60" y="535" width="220" height="44" rx="8"/>
  <text class="name" x="170" y="550">SweepStuckOrders</text>
  <text class="every" x="170" y="568">every 5 minutes</text>
  <text class="why" x="60" y="600">stuck before stock → FAILED</text>
  <text class="why" x="60" y="618">stuck charge or release → retried</text>
</svg>
